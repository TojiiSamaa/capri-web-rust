<text x="30" y="108" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" fill="#ececf1">Elle cligne, se balade, fait la sieste et glitche. Attrape-la, lance-la : elle</text><text x="30" y="138" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" fill="#ececf1">retombe, vexée.</text>
